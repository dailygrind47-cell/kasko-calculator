name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "KASKO_Calculator" --icon=NONE kasko_calculator.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: KASKO_Calculator_Windows
        path: dist/KASKO_Calculator.exe
        retention-days: 30
